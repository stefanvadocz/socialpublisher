[project]
name = "pr-social-publisher"
version = "0.1.0"
description = "Daily PR-content discovery, review, and social publishing app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
